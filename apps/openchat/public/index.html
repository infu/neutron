<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Tiles are pure view surfaces. They never call the OpenChat network
      directly; all data flows through the resident engine over the private
      message bus. So the tile only needs same-origin fetch (id.json / assets).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.raw.icp0.io; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>OpenChat</title>
    <link rel="stylesheet" href="./main.css" />
    <style>
      html,
      body {
        background: #0a0c10;
        margin: 0;
        min-height: 100%;
      }
      #root {
        min-height: 100dvh;
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
